[package]
name = "fllm-app"
version = "0.2.2"
description = "fLLM desktop app, native: the Studio written in Rust (iced), no web view"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Marco-Lu2508/fLLM"
rust-version = "1.90"
publish = false

# not part of the engine workspace (like desktop/src-tauri): the GUI has its own dependencies and lock file
[workspace]

[dependencies]
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "svg", "image"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf"] }
# parses the key links of the provider templates (`providerKeyLink` of `providers.js`: https only,
# with the host); the server parses addresses with the same crate
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rquickjs = "0.14.0"
# the Copy button of the connect card reads *Copied* until 1500 ms have passed (a sleep in a task)
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }

# the quick-entry hotkey works from any program; the tray icon is the system's (on Linux the
# StatusNotifier of the desktop over D-Bus, which needs no GTK)
global-hotkey = "0.10"
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# a picture on the clipboard (a screenshot) is attached by Ctrl+V as the page attaches it
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
# real typesetting of math and diagrams: both pure Rust, both answer with SVG
latex-rust = "3"
skrifa = "0.39"
usvg = { version = "0.45", default-features = false }
mermaid-rs-renderer = { version = "0.3", default-features = false }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
