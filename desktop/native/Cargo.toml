[package]
name = "fllm-app"
version = "0.2.2"
description = "fLLM desktop app, native: the Studio written in Rust (iced), no web view"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Marco-Lu2508/fLLM"
rust-version = "1.90"
publish = false

# not part of the engine workspace (like desktop/src-tauri): the GUI has its own dependencies and lock file
[workspace]

[dependencies]
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "svg", "image"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[dev-dependencies]
iced_test = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
