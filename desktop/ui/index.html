<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>fLLM</title>
<style>
  :root {
    --bg: #0b0d11; --fg: #e9eaee; --muted: #9aa1af; --line: rgba(233, 234, 238, 0.14);
    --accent: #e08a4b; --on-accent: #1a0e05; --danger: #f2766a; --surface: #12151c;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef0f2; --fg: #0e1116; --muted: #566070; --line: rgba(14, 17, 22, 0.16); --accent: #b4541f; --on-accent: #ffffff; --danger: #b42318; --surface: #ffffff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--fg);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  main { width: min(440px, 100% - 48px); text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 18px; }
  h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  #note { margin: 0 auto; min-height: 3.1em; max-width: 38ch; color: var(--muted); overflow-wrap: anywhere; }
  .bar { position: relative; height: 3px; margin: 22px auto 0; width: 160px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: var(--accent); animation: slide 1.5s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: 0.45; } }
  .failed .bar { display: none; }
  .failed #note { color: var(--fg); }
  .failed h1 { color: var(--danger); }
  #actions { display: none; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
  .failed.can-act #actions { display: flex; }
  button {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 9px; padding: 8px 16px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #hint { margin-top: 26px; font-size: 13px; color: var(--muted); }
  .failed #hint { display: none; }
</style>
</head>
<body>
<main id="box">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#121a21"/><circle cx="16" cy="16" r="8" fill="#43c0aa"/></svg>
  <h1 id="title">fLLM</h1>
  <p id="note" role="status" aria-live="polite">Starting the engine ...</p>
  <div class="bar" aria-hidden="true"></div>
  <div id="actions">
    <button type="button" class="primary" id="restart">Restart the engine</button>
    <button type="button" id="logs">Open the log folder</button>
  </div>
  <p id="hint">The first start can take a minute while the last model loads.</p>
</main>
<script>
  // The app passes a message in the fragment of the address. A message that starts with "!" says the engine did not start; the page
  // then offers the two ways out. The app also writes progress text into #note while a model loads.
  var box = document.getElementById('box');
  function invoke(name) {
    try {
      var t = window.__TAURI_INTERNALS__;
      if (t && t.invoke) return t.invoke(name);
    } catch (e) { /* the buttons are hidden when the call is not there */ }
    return null;
  }
  function show() {
    var text = '';
    try { text = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    if (!text) return;
    var failed = text.charAt(0) === '!';
    if (failed) text = text.slice(1);
    document.getElementById('note').textContent = text;
    document.getElementById('title').textContent = failed ? 'The engine is not running' : 'fLLM';
    box.classList.toggle('failed', failed);
    box.classList.toggle('can-act', failed && !!(window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke));
    if (failed) document.getElementById('restart').focus();
  }
  document.getElementById('restart').addEventListener('click', function () {
    document.getElementById('note').textContent = 'Restarting the engine ...';
    box.classList.remove('failed', 'can-act');
    document.getElementById('title').textContent = 'fLLM';
    invoke('restart_server');
  });
  document.getElementById('logs').addEventListener('click', function () { invoke('open_log_folder'); });
  show();
  addEventListener('hashchange', show);
</script>
</body>
</html>
