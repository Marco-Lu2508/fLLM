[package]
name = "fllm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
fllm-gguf-probe = { path = "../rust/gguf-probe" }
fllm-checkpoint = { path = "../rust/checkpoint" }
fllm-engine = { path = "../rust/engine", default-features = false }

# not a member of the main workspace: `cargo build` at the repository root does not build the fuzz targets
[workspace]

[[bin]]
name = "gguf"
path = "fuzz_targets/gguf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safetensors"
path = "fuzz_targets/safetensors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pytorch"
path = "fuzz_targets/pytorch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chat_template"
path = "fuzz_targets/chat_template.rs"
test = false
doc = false
bench = false
