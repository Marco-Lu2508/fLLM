# The prefix-aware router in front of the fLLM replicas: same prefix, same backend, so the prefix cache keeps working.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fllm-router
  namespace: fllm
spec:
  replicas: 1
  selector:
    matchLabels: {app: fllm-router}
  template:
    metadata:
      labels: {app: fllm-router}
    spec:
      containers:
        - name: router
          image: ghcr.io/marco-lu2508/fllm:latest
          entrypoint: ["/usr/local/bin/fllm-router"]
          args:
            - --listen=0.0.0.0:8080
            - --backend=http://fllm-0.fllm.fllm.svc.cluster.local:8000
            - --backend=http://fllm-1.fllm.fllm.svc.cluster.local:8000
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /router/stats, port: http}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fllm-router
  namespace: fllm
spec:
  selector: {app: fllm-router}
  ports:
    - {name: http, port: 8080, targetPort: http}
