[package]
name = "fllm-engine"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
getrandom = "0.3"
regex = "1"
fllm-checkpoint = { path = "../checkpoint" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
ahash = "0.8.12"
fllm-gguf-probe = { path = "../gguf-probe" }
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
half = "2"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12", "gles"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
ash = { version = "0.38", optional = true }
libloading = { version = "0.8", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
minijinja = { version = "2", features = ["json", "preserve_order", "loop_controls", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
llguidance = { version = "=1.8.0", default-features = false, features = ["lark", "referencing", "ahash"] }
jsonschema = { version = "=0.29.1", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# optional TLS for the HTTP listener (--tls-cert): rustls with the ring provider the HTTP client already links
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi"] }

# the Windows sandbox for agent commands (job object, restricted token); already in the lock file through other crates, so nothing new is built
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

[dev-dependencies]
# self-signed certificate for the TLS listener test
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[features]
# The x86-64 AVX-512 / AMX kernels are compiled in by default: they are #[target_feature] functions chosen at run time by CPUID,
# so the binary still runs on any x86-64 CPU (docs/cpu-kernels.md, "Building with the avx512 feature"). `--no-default-features` leaves them out.
default = ["avx512", "npu-openvino", "npu-xdna-native", "computer-use"]
rust-gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
cuda = ["dep:libloading"]
# native backends (all optional; none is in the default set). Verification level of each is in docs/backends.md
vulkan = ["dep:ash"]
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
# AMD: the CUDA sources built with hipcc (FLLM_HIP=1) behind the cuda backend; this feature adds the HIP-specific Rust glue
hip = ["cuda"]
sycl = []
# Intel NPU through the OpenVINO C runtime, which is opened at run time (no link-time dependency): the feature is in the default set so that
# the same binary can use an NPU once the runtime is installed (`fllm-rs npu-setup`, or Settings > Hardware in the Studio).
npu-openvino = ["dep:libloading"]
npu-xdna = ["dep:libloading"]
# AMD XDNA NPU driven natively through XRT (our own kernels, no vendor inference library). XRT is reached through a small C++ shim that is opened
# at run time, so the feature adds no link-time dependency. It shares the hybrid CPU wrapper of the OpenVINO backend, hence the dependency.
npu-xdna-native = ["npu-openvino"]
npu-qnn = ["dep:libloading"]
npu-ane = []
tpu-pjrt = ["dep:libloading"]
arm-simd = []
avx512 = []
# Computer use for the coding agent (screenshots, mouse, keyboard): a thin layer over the operating system written against X11 (Linux),
# GDI/SendInput (Windows) and CoreGraphics (macOS) with no extra crates. It is compiled in by default but off at run time until the user
# switches it on in Settings > Runtime. docs/user/studio.md, "Computer use".
computer-use = []

[lib]
name = "fllm_engine"
path = "src/lib.rs"

[[bin]]
name = "fllm-rs"
path = "src/bin/serve.rs"

# the prefix-aware router that sits in front of several fLLM servers
[[bin]]
name = "fllm-router"
path = "src/bin/router.rs"
