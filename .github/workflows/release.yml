# Builds the release binaries for a version tag (v*) on GitHub-hosted runners and attaches them to the GitHub release of that tag.
#
#   git tag v0.1.2 && git push --tags
#
# or Actions -> release -> Run workflow with the tag of an existing release (re-builds and replaces the assets).
#
# Asset names are part of the install-script contract (install.sh / install.ps1):
#   fllm-linux-x86_64-musl.tar.gz, fllm-linux-aarch64-musl.tar.gz (static CPU binaries),
#   fllm-linux-x86_64-gnu.tar.gz, fllm-linux-aarch64-gnu.tar.gz (glibc dynamic binaries for dlopen of libvulkan.so / libcuda.so),
#   fllm-linux-x86_64-cuda.tar.gz (optional CUDA + Vulkan glibc archive for `install.sh --variant cuda`),
#   fllm-macos-aarch64.tar.gz, fllm-macos-x86_64.tar.gz,
#   fllm-windows-x86_64-msvc.zip, fllm-windows-x86_64-msvc-cuda.zip (optional, see below),
#   plus <asset>.sha256 (one line: "<hash>  <asset>") and <asset>.sigstore.json (keyless OIDC cosign bundle).
# Every archive bundles fllm-rs(.exe), LICENSE, NOTICE, THIRD_PARTY.md, and licenses/.
# `finalize` appends a "<sha256>  <asset>" checksum table to the release notes so install.sh and install.ps1 verify both sources.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Feature set used by make build-rust / install.sh / docker/Dockerfile. The native `vulkan` feature is not part of the release assets and
  # the native `metal` feature only of the Apple-silicon asset when the repository variable FLLM_RELEASE_METAL is 1 (wgpu already uses
  # Metal / Vulkan / DirectX 12); see docs/backends.md for their verification level.
  RUST_FEATURES: rust-gpu

jobs:
  check-version:
    name: tag matches Cargo version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9][0-9A-Za-z._-]*$'; then
            echo "::error::'$TAG' is not a version tag (expected v<digit>..., e.g. v0.1.2)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Tag must equal the workspace version in Cargo.toml
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          version=$(tr -d '\r' < Cargo.toml | awk '/^\[workspace\.package\]/{on=1; next} /^\[/{on=0} on && /^version[[:space:]]*=/{gsub(/^[^"]*"|".*$/, ""); print; exit}')
          if [ -z "$version" ]; then
            echo "::error::no version found in [workspace.package] of Cargo.toml"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match the Cargo workspace version $version (bump Cargo.toml and Cargo.lock, or tag v$version)"
            exit 1
          fi
          echo "tag $TAG matches workspace version $version"

  prepare:
    name: create release
    needs: check-version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9][0-9A-Za-z._-]*$'; then
            echo "::error::'$TAG' is not a version tag (expected v<digit>..., e.g. v0.1.2)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Create or reset the release as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --prerelease --latest=false
          fi

  build:
    name: ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: fllm-linux-x86_64-musl.tar.gz
            runner: ubuntu-24.04
            features: avx512
            glslc: false
            dlopen_check: false
          - target: aarch64-unknown-linux-musl
            asset: fllm-linux-aarch64-musl.tar.gz
            runner: ubuntu-24.04-arm
            features: arm-simd
            glslc: false
            dlopen_check: false
          - target: x86_64-unknown-linux-gnu
            asset: fllm-linux-x86_64-gnu.tar.gz
            runner: ubuntu-24.04
            features: rust-gpu,vulkan,avx512
            glslc: true
            dlopen_check: true
          - target: aarch64-unknown-linux-gnu
            asset: fllm-linux-aarch64-gnu.tar.gz
            runner: ubuntu-24.04-arm
            features: rust-gpu,vulkan,arm-simd
            glslc: true
            dlopen_check: true
          - target: aarch64-apple-darwin
            asset: fllm-macos-aarch64.tar.gz
            runner: macos-14
            features: rust-gpu,metal
            glslc: false
            dlopen_check: false
          - target: x86_64-apple-darwin
            asset: fllm-macos-x86_64.tar.gz
            runner: macos-15-intel
            features: rust-gpu,metal
            glslc: false
            dlopen_check: false
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      FEATURES: ${{ matrix.features }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain input selects the version
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: musl toolchain (Linux static)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          triple_env=$(printf '%s' "$TARGET" | tr '-' '_')
          echo "CC_${triple_env}=musl-gcc" >> "$GITHUB_ENV"

      - name: Shader compiler (Linux glibc)
        if: matrix.glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc

      # Native Metal backend in the Apple-silicon asset: off by default. Switch it on with the repository variable FLLM_RELEASE_METAL=1
      # (Settings > Secrets and variables > Actions > Variables) once the whole-model tests of the macOS 14 job of platforms.yml passed; see
      # docs/changes/metal.md. The macOS Intel asset and all other targets keep the wgpu feature set.
      - name: Build
        env:
          NATIVE_METAL: ${{ vars.FLLM_RELEASE_METAL }}
        run: |
          features="$FEATURES"
          if [ "$NATIVE_METAL" = "1" ] && [ "$TARGET" = "aarch64-apple-darwin" ]; then
            features="$features,metal"
            echo "building with the native Metal backend: $features"
          fi
          cargo build --release --locked -p fllm-engine \
            --features "$features" --bin fllm-rs --target "$TARGET"

      - name: Smoke test
        run: '"target/$TARGET/release/fllm-rs" --help'

      - name: Verify dynamic dlopen support (Linux gnu)
        if: matrix.dlopen_check
        run: ./scripts/verify-dlopen.sh "target/$TARGET/release/fllm-rs"

      - name: Optional macOS codesign and notarization
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -eu
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "macOS signing secrets not configured; skipping codesign/notarization"
            exit 0
          fi
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MACOS_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CERT_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CERT_PASSWORD" build.keychain
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "target/$TARGET/release/fllm-rs"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            ditto -c -k --keepParent "target/$TARGET/release/fllm-rs" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          fi

      - name: Package with legal notices
        run: |
          set -e
          mkdir -p pkg
          cp dist-cuda/fllm-rs pkg/fllm-rs
          cp LICENSE NOTICE THIRD_PARTY.md pkg/
          cp -r licenses pkg/licenses
          tar -czf "$ASSET" -C pkg fllm-rs LICENSE NOTICE THIRD_PARTY.md licenses

      - name: Checksum
        run: |
          set -e
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
          cat "$ASSET.sha256"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with Cosign (keyless OIDC)
        run: cosign sign-blob --yes --bundle "$ASSET.sigstore.json" "$ASSET"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.sigstore.json" --clobber

  linux-cuda:
    name: fllm-linux-x86_64-cuda.tar.gz
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ASSET: fllm-linux-x86_64-cuda.tar.gz
      TARGET: x86_64-unknown-linux-gnu
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Build (CUDA container; sm_75..sm_120 plus PTX of the highest arch)
        run: ./scripts/release/build-linux-cuda.sh

      - name: Verify dynamic dlopen support
        run: ./scripts/verify-dlopen.sh dist-cuda/fllm-rs

      - name: Package with legal notices
        run: |
          set -e
          mkdir -p pkg
          cp dist-cuda/fllm-rs pkg/fllm-rs
          cp LICENSE NOTICE THIRD_PARTY.md pkg/
          cp -r licenses pkg/licenses
          tar -czf "$ASSET" -C pkg fllm-rs LICENSE NOTICE THIRD_PARTY.md licenses
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Verify (starts in a clean ubuntu:22.04 without the CUDA toolkit)
        run: ./scripts/release/verify-linux-cuda-package.sh "$ASSET"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with Cosign (keyless OIDC)
        run: cosign sign-blob --yes --bundle "$ASSET.sigstore.json" "$ASSET"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fllm-linux-x86_64-cuda.tar.gz

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.sigstore.json" --clobber

  windows:
    name: fllm-windows-x86_64-msvc.zip
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain input selects the version
        with:
          toolchain: stable

      - name: Vulkan SDK (glslc for the native Vulkan backend, sets VULKAN_SDK)
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Build and pack
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipTests -OutDir dist

      - name: Optional Windows Authenticode signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) {
            Write-Host "WINDOWS_CERT_PFX secret not configured; skipping Authenticode signing"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\x86_64-pc-windows-msvc\release\fllm-rs.exe
          }
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with Cosign (keyless OIDC)
        shell: bash
        run: |
          for f in dist/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 dist/*.sigstore.json --clobber

  windows-cuda:
    name: fllm-windows-x86_64-msvc-cuda.zip
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 360
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain input selects the version
        with:
          toolchain: stable

      - name: Vulkan SDK (glslc for the native Vulkan backend, sets VULKAN_SDK)
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: CUDA toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          log-file-suffix: "release-windows-cuda.txt"

      - name: CUTLASS and FlashInfer headers
        shell: bash
        run: |
          git clone --depth 1 --branch v4.8.0 https://github.com/NVIDIA/cutlass third_party/cutlass
          git clone --depth 1 --branch v0.6.5 https://github.com/flashinfer-ai/flashinfer third_party/flashinfer

      - name: Build and pack (all GPU architectures of the default list)
        shell: pwsh
        env:
          FLLM_CUDA_EXTRA_FLAGS: "-allow-unsupported-compiler -diag-suppress 69"
        run: ./scripts/build-windows.ps1 -Cuda -SkipTests -OutDir dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with Cosign (keyless OIDC)
        shell: bash
        run: |
          for f in dist/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 dist/*.sigstore.json --clobber

  # Optional: a glibc binary that can load the NVIDIA driver (libcuda.so.1) at run time; the static musl asset cannot.
  # Built inside nvidia/cuda:12.8.1-devel-ubuntu22.04 (glibc floor 2.35, the base used by kernels.yml) via
  # scripts/release/build-linux-cuda.sh; CUDA runtime is linked statically, so no CUDA toolkit is needed on the user's machine.
  # The job runs on the host (not in a container) so that the smoke test can start a clean ubuntu:22.04 container with docker.
  # install.sh falls back to the musl asset, so a failure here does not block `finalize`.
  finalize:
    name: publish release
    needs: [prepare, build, linux-cuda, windows, windows-cuda]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      LINUX_CUDA_RESULT: ${{ needs.linux-cuda.result }}
      CUDA_RESULT: ${{ needs.windows-cuda.result }}
    steps:
      - name: Check the assets and append SHA256 checksum table to release notes
        run: |
          set -eu
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > assets.txt
          cat assets.txt
          missing=0
          for a in fllm-linux-x86_64-musl.tar.gz fllm-linux-aarch64-musl.tar.gz                    fllm-linux-x86_64-gnu.tar.gz fllm-linux-aarch64-gnu.tar.gz                    fllm-macos-aarch64.tar.gz fllm-macos-x86_64.tar.gz fllm-windows-x86_64-msvc.zip; do
            for f in "$a" "$a.sha256"; do
              grep -qx "$f" assets.txt || { echo "::error::missing release asset $f"; missing=1; }
            done
          done
          [ "$missing" = 0 ]
          if [ "$LINUX_CUDA_RESULT" != "success" ]; then
            echo "::warning::fllm-linux-x86_64-cuda.tar.gz was not built (job result: $LINUX_CUDA_RESULT); install.sh prints the Docker CUDA command"
          fi
          if [ "$CUDA_RESULT" != "success" ]; then
            echo "::warning::fllm-windows-x86_64-msvc-cuda.zip was not built (job result: $CUDA_RESULT); install.ps1 uses the plain Windows asset"
          fi
          mkdir -p sums
          gh release download "$TAG" --pattern "*.sha256" --dir sums --clobber
          gh release view "$TAG" --json body --jq '.body // ""' > notes.md
          {
            cat notes.md
            echo ""
            echo "## Checksums (SHA-256)"
            echo ""
            echo '```text'
            cat sums/*.sha256 | tr -d '\r' | sort -k2
            echo '```'
          } > updated-notes.md
          gh release edit "$TAG" --notes-file updated-notes.md

      - name: Set the final state
        run: |
          set -eu
          case "$TAG" in
            v0.*|*-*) gh release edit "$TAG" --prerelease --latest=false ;;
            *)        gh release edit "$TAG" --prerelease=false --latest ;;
          esac
          gh release view "$TAG" --json url,isPrerelease --jq '"\(.url) prerelease=\(.isPrerelease)"'
