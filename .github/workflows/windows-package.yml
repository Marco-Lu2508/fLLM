# The Windows package without CUDA (fllm-windows-x86_64-msvc.zip: CPU, DirectX 12 / Vulkan through wgpu, native Vulkan) plus the check script
# scripts/windows-check.ps1, as a downloadable workflow artifact (no release, no tag). Runs by hand (Actions -> windows-package -> Run workflow)
# and on a push to main that changes this workflow, the Windows build script or the check script.
name: windows-package

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-package.yml"
      - "scripts/build-windows.ps1"
      - "scripts/windows-check.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package
  cancel-in-progress: true

jobs:
  package:
    name: Windows package (CPU and Vulkan)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain input selects the version
        with:
          toolchain: stable

      - name: Vulkan SDK (glslc for the native Vulkan backend, sets VULKAN_SDK)
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: Build and pack
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -SkipTests -OutDir dist *>&1 | Tee-Object -FilePath build.log
          if (-not (Test-Path dist/*.zip)) {
            $tail = ((Select-String -Path build.log -Pattern 'error [A-Z]*[0-9]+|fatal error|error:|LNK[0-9]+|Write-Error' | Select-Object -First 25 | ForEach-Object { $_.Line.Trim() }) -join '%0A')
            Write-Host "::error title=Windows build failed::$tail"
            exit 1
          }
          Copy-Item scripts/windows-check.ps1 dist/

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fllm-windows-x86_64-msvc
          path: dist/*
          retention-days: 30
