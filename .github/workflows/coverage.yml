# Code coverage with cargo-llvm-cov and a weekly/manual nightly Rust compiler check.
name: coverage

on:
  push:
    branches: [main]
  schedule:
    - cron: "42 3 * * 1" # Mondays 03:42 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  llvm-cov:
    name: cargo llvm-cov (workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain input selects the version
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: llvm-cov

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov

      - name: Run workspace tests under llvm-cov
        run: |
          cargo llvm-cov --locked -p fllm-engine -p fllm-checkpoint -p fllm-gguf-probe --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov-report
          path: lcov.info

  nightly:
    name: Rust nightly compiler check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; the toolchain input selects the version
        with:
          toolchain: nightly
          components: clippy

      - name: Check and test with nightly
        run: |
          cargo check --locked --workspace --all-targets --features rust-gpu
          cargo test --release --locked -p fllm-checkpoint -p fllm-gguf-probe
