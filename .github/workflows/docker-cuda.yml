# Builds the CUDA image (docker/Dockerfile.cuda) for linux/amd64 and publishes it to the GitHub Container Registry as
#   ghcr.io/<owner>/fllm:cuda, :cuda-<tag> (cuda-v0.1.0), :cuda-sha-<short>
# Runs on version tags (v*) and manually, never on pushes to branches: the build is heavy. nvcc compiles the kernels without a GPU, so a
# hosted runner is enough. A hosted runner has 4 cores: the full build (all architectures) takes several hours (about 25-40 minutes on 20
# threads); the input `cuda_archs` of a manual run narrows it, e.g. 120 for a quick build. Layer caching skips the dependency step when
# Cargo.toml / Cargo.lock did not change. A manual run on a branch only pushes the :cuda-sha-<short> tag. See docs/ci.md.
name: docker-image-cuda

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "GPU architectures, separated by semicolons"
        default: "61;70;75;80;86;89;90;120"
        type: string

permissions:
  contents: read

concurrency:
  group: docker-cuda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-cuda:
    name: build and push the CUDA image
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space (the CUDA devel image and its layers need more than a stock runner has free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Image name (the registry needs lower case)
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/fllm" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=cuda,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=tag,prefix=cuda-
            type=sha,prefix=cuda-sha-,format=short
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            JOBS=3
            CUDA_ARCHS=${{ inputs.cuda_archs || '61;70;75;80;86;89;90;120' }}
          cache-from: type=gha,scope=cuda
          cache-to: type=gha,mode=max,scope=cuda
