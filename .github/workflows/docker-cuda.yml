# Builds the CUDA image (docker/Dockerfile.cuda) for linux/amd64 and linux/arm64 (Grace Hopper sm_90, Jetson Orin sm_87,
# DGX Spark sm_121 on CUDA >= 12.8) and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/fllm:cuda, :cuda-<tag> (cuda-v0.1.2), :cuda-sha-<short>
# Runs on version tags (v*) and manually. See docs/ci.md and docs/docker.md.
name: docker-image-cuda

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "GPU architectures separated by semicolons, or 'auto' for per-platform defaults"
        default: "auto"
        type: string

permissions:
  contents: read

concurrency:
  group: docker-cuda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build CUDA ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            pair: amd64
            default_archs: "61;70;75;80;86;89;90;120"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            pair: arm64
            default_archs: "87;90;121"
    steps:
      - name: Free disk space (the CUDA devel image and its layers need more than a stock runner has free)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Image name (the registry needs lower case)
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/fllm" >> "$GITHUB_OUTPUT"

      - name: Resolve CUDA architectures
        id: archs
        env:
          INPUT_ARCHS: ${{ inputs.cuda_archs }}
          DEFAULT_ARCHS: ${{ matrix.default_archs }}
        run: |
          if [ -z "$INPUT_ARCHS" ] || [ "$INPUT_ARCHS" = "auto" ]; then
            echo "archs=$DEFAULT_ARCHS" >> "$GITHUB_OUTPUT"
          else
            echo "archs=$INPUT_ARCHS" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.cuda
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: false
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            JOBS=3
            CUDA_ARCHS=${{ steps.archs.outputs.archs }}
          cache-from: type=gha,scope=cuda-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=cuda-${{ matrix.pair }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Keep the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cuda-digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: multi-arch CUDA tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (the registry needs lower case)
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/fllm" >> "$GITHUB_OUTPUT"

      - name: Fetch the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: cuda-digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=cuda,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=tag,prefix=cuda-
            type=sha,prefix=cuda-sha-,format=short

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-arch CUDA manifest
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          META_JSON: ${{ steps.meta.outputs.json }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          tag_args=()
          while read -r t; do tag_args+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$META_JSON")
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
