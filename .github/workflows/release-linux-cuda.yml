# Builds only the Linux CUDA engine archive of an existing release again (fllm-linux-x86_64-cuda.tar.gz), with the build script of
# main (memory-friendly nvcc settings and a swap file), from the source of the tag. The release workflow builds it too; this is for
# the case that its run lost that job (a runner killed for memory) and the other assets of the release are fine.
name: release-linux-cuda

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag whose Linux CUDA archive is built again (for example v0.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-cuda:
    name: fllm-linux-x86_64-cuda.tar.gz
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      ASSET: fllm-linux-x86_64-cuda.tar.gz
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Swap file
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/fllm-swap
          sudo chmod 600 /mnt/fllm-swap
          sudo mkswap /mnt/fllm-swap
          sudo swapon /mnt/fllm-swap
          free -g

      - name: Checkout the source of the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Take the build scripts of main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          path: main-scripts
          persist-credentials: false
          sparse-checkout: scripts/release

      - name: Use them
        run: cp main-scripts/scripts/release/* scripts/release/

      - name: Build (CUDA container; sm_75..sm_120 plus PTX of the highest arch)
        env:
          RUST_FEATURES: rust-gpu,cuda
        run: ./scripts/release/build-linux-cuda.sh

      - name: Verify dynamic dlopen support
        run: ./scripts/verify-dlopen.sh dist-cuda/fllm-rs

      - name: Package with legal notices
        run: |
          set -e
          mkdir -p pkg
          cp dist-cuda/fllm-rs pkg/fllm-rs
          cp LICENSE NOTICE THIRD_PARTY.md pkg/
          cp -r licenses pkg/licenses
          tar -czf "$ASSET" -C pkg fllm-rs LICENSE NOTICE THIRD_PARTY.md licenses
          sha256sum "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - name: Verify (starts in a clean ubuntu:22.04 without the CUDA toolkit)
        run: ./scripts/release/verify-linux-cuda-package.sh "$ASSET"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign archive with Cosign (keyless OIDC)
        run: for attempt in 1 2 3; do cosign sign-blob --yes --bundle "$ASSET.sigstore.json" "$ASSET" && break; [ "$attempt" = 3 ] && exit 1; sleep $((attempt * 30)); done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fllm-linux-x86_64-cuda.tar.gz

      - name: Upload to the release
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.sigstore.json" --clobber
