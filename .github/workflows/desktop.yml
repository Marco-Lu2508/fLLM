# The desktop app (Tauri): the Studio in its own window with the server built in, as an installer per system (Windows: setup and msi,
# Linux: deb, rpm and AppImage). A downloadable workflow artifact, no release, no tag. Runs by hand (Actions -> desktop -> Run workflow)
# and on a push to main that changes the app or this workflow. Installers are not signed yet.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain input selects the version
        with:
          toolchain: stable

      - name: Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslc libvulkan-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm file

      - name: Build the server program
        shell: bash
        run: |
          cargo build --release --locked -p fllm-engine --features rust-gpu,vulkan --bin fllm-rs
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""; if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p desktop/src-tauri/binaries
          cp "target/release/fllm-rs$ext" "desktop/src-tauri/binaries/fllm-rs-$triple$ext"

      - name: Tauri command line tool
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the installers
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          cargo tauri icon ../app-icon.png
          cargo tauri build

      - name: Keep the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fllm-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30