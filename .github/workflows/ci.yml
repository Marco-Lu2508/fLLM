name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build, test, lint (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p fllm-engine --bin fllm-rs
      - name: Unit tests
        run: cargo test --workspace --locked --lib
      - name: Clippy
        run: cargo clippy --workspace --locked --lib --bins -- -D warnings
      - name: CPU kernel self test
        run: ./target/release/fllm-rs selftest-cpu

  hip-build:
    name: AMD ROCm build (compile only)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-24.04:latest
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates pkg-config cmake clang build-essential git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - name: Build with the HIP kernels (RDNA2-4, CDNA2/3)
        env:
          FLLM_HIP: "1"
          FLLM_HIP_ARCHS: "gfx1030;gfx1100;gfx1201;gfx942"
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked --features cuda -p fllm-engine --bin fllm-rs

  cuda-build:
    name: CUDA build (no GPU needed to compile)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates pkg-config cmake clang build-essential git
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy
      - uses: actions/checkout@v4
      - name: CUTLASS headers (NVFP4 prompt GEMM for Blackwell)
        run: |
          git clone --depth 1 --branch v4.8.0 https://github.com/NVIDIA/cutlass third_party/cutlass
          git clone --depth 1 --branch v0.6.5 https://github.com/flashinfer-ai/flashinfer third_party/flashinfer
      - name: Build with the CUDA kernels (Ampere, Hopper, Blackwell)
        env:
          FLLM_CUDA_ARCHS: "80;90;120"
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked --features cuda -p fllm-engine --bin fllm-rs
      - name: Clippy with the CUDA feature
        env:
          FLLM_CUDA_ARCHS: "80"
        run: |
          . "$HOME/.cargo/env"
          cargo clippy --locked --features cuda -p fllm-engine --lib --bins -- -D warnings
