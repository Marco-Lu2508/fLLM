# The native desktop app (desktop/native, Rust and iced, no web view): clippy, the tests (the window is driven and drawn headless with the
# software renderer, so no display or GPU is needed) and a release build, on the three systems. The pictures of the window are kept as an
# artifact. Not part of the engine workspace: it has its own lock file.
name: native-app

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-app.yml"
      - "desktop/native/**"
      - "design-system/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop/native
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: Windows
            os: windows-2025
          - name: macOS
            os: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master; the toolchain input selects the version
        with:
          toolchain: stable
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/native

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Pictures of the window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-app-window-${{ matrix.name }}
          path: desktop/native/target/tmp/ui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 7
